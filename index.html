<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site under construction</title>
<meta name="description" content="This site is currently under construction.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #F7F6F4;
    --ink: #1C1C1A;
    --muted: #7A7873;
    --rule: #E3E0DA;
    --sweep: #B2AFA7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
  }

  main {
    max-width: 520px;
    width: 100%;
    animation: rise 0.9s ease both;
  }

  h1 {
    margin: 0;
    font-size: clamp(27px, 5.6vw, 44px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-wrap: balance;
  }

  p {
    margin: 20px auto 0;
    max-width: 440px;
    font-size: clamp(15px, 2.4vw, 17px);
    line-height: 1.65;
    color: var(--muted);
    font-weight: 400;
    text-wrap: balance;
  }

  .rule {
    width: 132px;
    height: 2px;
    margin: 38px auto 0;
    border-radius: 2px;
    background: var(--rule);
    overflow: hidden;
    position: relative;
  }

  .rule::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 42%;
    border-radius: 2px;
    background: var(--sweep);
    animation: sweep 2.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @keyframes sweep {
    0%   { transform: translateX(-110%); }
    50%  { transform: translateX(150%); }
    100% { transform: translateX(150%); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .rule::after { animation: none; width: 42%; transform: none; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --ink: #F2F1EE;
      --muted: #8E8C87;
      --rule: #2B2B29;
      --sweep: #55534E;
    }
  }
</style>
</head>
<body>
  <main>
    <h1>Site under construction</h1>
    <p>We are building something here. Please check back soon.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
