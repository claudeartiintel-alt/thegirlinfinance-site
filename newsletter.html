<link rel="stylesheet" href="styles.css">
<style>
  .nl-mini-hero { text-align:center; padding:56px 24px 6px; background:radial-gradient(120% 90% at 50% 0%, #2A2550 0%, #1A1735 45%, var(--deep-space) 100%); }
  .nl-mini-hero .eyebrow { color:var(--gold); }
  .nl-mini-hero h1 { font-size:clamp(38px,6vw,60px); line-height:1; margin-bottom:12px; }
  .nl-mini-hero p { color:var(--mauve); font-size:15px; }
  .nl-frame-wrap { max-width:760px; margin:0 auto; padding:26px 12px 56px; }
  iframe#issue { width:100%; border:0; display:block; background:#0B0A18; border-radius:14px; min-height:1600px; }
</style>
</head>
<body>

  <nav class="nav">
    <a class="nav-logo" href="index.html"><img src="assets/emblem-dark.png" alt="The Girl in Finance"></a>
    <div class="nav-links">
      <a href="index.html#learn" class="nav-link">Learn</a>
      <a href="index.html#watch" class="nav-link">Watch</a>

      </div>

  </footer>

  <script>
    (function () {
      var f = document.getElementById('issue');
      function resize() {
        try {
          var h = f.contentWindow.document.body.scrollHeight;
          if (h && h > 200) f.style.height = (h + 40) + 'px';
        } catch (e) { /* leave min-height */ }
      }
      f.addEventListener('load', resize);
      setTimeout(resize, 500);
      setTimeout(resize, 1500);
      window.addEventListener('resize', resize);
    })();
  </script>
